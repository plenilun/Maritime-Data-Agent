<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1200" viewBox="0 0 1440 1200" role="img" aria-labelledby="title desc">
  <title id="title">Maritime Data Agent execution workflow</title>
  <desc id="desc">Execution workflow for the maritime data Agent from user question to planner, tools, SQL validation, repair, answer generation, memory, and evals.</desc>
  <defs>
    <style>
      .bg { fill: #fbfcf7; }
      .title { font: 700 42px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #596579; }
      .node-title { font: 700 18px Arial, sans-serif; fill: #172033; }
      .node-body { font: 400 14px Arial, sans-serif; fill: #475569; }
      .small { font: 700 13px Arial, sans-serif; fill: #64748b; }
      .node { fill: #ffffff; stroke: #d6dee8; stroke-width: 2; rx: 16; }
      .agent { fill: #eef6ff; stroke: #74aee7; stroke-width: 2; rx: 16; }
      .decision { fill: #fff8ed; stroke: #e3ba71; stroke-width: 2; }
      .memory { fill: #f0fbf6; stroke: #8ccbaa; stroke-width: 2; rx: 16; }
      .safety { fill: #fff4f2; stroke: #ee9387; stroke-width: 2; rx: 16; }
      .eval { fill: #f7f2ff; stroke: #b69be4; stroke-width: 2; rx: 16; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
      .arrow-soft { fill: none; stroke: #94a3b8; stroke-width: 2; marker-end: url(#arrow-soft); }
      .branch { fill: none; stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow); stroke-dasharray: 7 6; }
      .label { font: 700 14px Arial, sans-serif; fill: #334155; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-soft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect class="bg" width="1440" height="1200"/>
  <text class="title" x="72" y="76">Agent Execution Workflow</text>
  <text class="subtitle" x="72" y="110">当前第 5 阶段：可规划、可调用工具、可记忆、可修复、可评测</text>

  <rect class="node" x="520" y="150" width="400" height="72"/>
  <text class="node-title" x="560" y="180">User Question</text>
  <text class="node-body" x="560" y="205">自然语言航运业务问题，可选手动指定主表</text>

  <rect class="agent" x="520" y="270" width="400" height="82"/>
  <text class="node-title" x="560" y="302">Agent 初始化</text>
  <text class="node-body" x="560" y="327">建立任务状态、trace、初始 plan 和 step 记录</text>

  <rect class="agent" x="520" y="400" width="400" height="82"/>
  <text class="node-title" x="560" y="432">Bootstrap Plan</text>
  <text class="node-body" x="560" y="457">context.load -> intent.route</text>

  <polygon class="decision" points="720,536 920,626 720,716 520,626"/>
  <text class="node-title" text-anchor="middle" x="720" y="610">Planner Decision</text>
  <text class="node-body" text-anchor="middle" x="720" y="635">问题是否足够明确？</text>
  <text class="node-body" text-anchor="middle" x="720" y="658">选择 clarify 或 query</text>

  <rect class="node" x="112" y="596" width="320" height="88"/>
  <text class="node-title" x="144" y="628">Clarify Path</text>
  <text class="node-body" x="144" y="653">memory.recall -> answer.clarify</text>
  <text class="node-body" x="144" y="676">memory.save 保存澄清记录</text>

  <rect class="memory" x="1008" y="578" width="320" height="106"/>
  <text class="node-title" x="1040" y="612">Memory Recall</text>
  <text class="node-body" x="1040" y="637">按问题、意图、数据集、表名召回</text>
  <text class="node-body" x="1040" y="660">历史 SQL 与业务口径进入 route_info</text>

  <rect class="node" x="1008" y="744" width="320" height="106"/>
  <text class="node-title" x="1040" y="778">Data Planning</text>
  <text class="node-body" x="1040" y="803">table.plan 选择主表和关联表</text>
  <text class="node-body" x="1040" y="826">terms.retrieve / codes.resolve 加业务约束</text>

  <rect class="node" x="1008" y="910" width="320" height="88"/>
  <text class="node-title" x="1040" y="944">SQL Generate</text>
  <text class="node-body" x="1040" y="969">基于 schema、术语、编码、JOIN 计划生成 SQL</text>

  <rect class="safety" x="560" y="910" width="320" height="88"/>
  <text class="node-title" x="592" y="944">SQL Safety</text>
  <text class="node-body" x="592" y="969">只读 / 单语句 / 表白名单 / 编码边界</text>

  <rect class="node" x="112" y="910" width="320" height="88"/>
  <text class="node-title" x="144" y="944">Query Execute</text>
  <text class="node-body" x="144" y="969">SQLite 只读执行，并翻译结果编码</text>

  <rect class="agent" x="112" y="1046" width="320" height="88"/>
  <text class="node-title" x="144" y="1080">Answer + Trace</text>
  <text class="node-body" x="144" y="1105">生成中文回答、SQL、结果明细和追溯记录</text>

  <rect class="memory" x="560" y="1046" width="320" height="88"/>
  <text class="node-title" x="592" y="1080">Memory Save</text>
  <text class="node-body" x="592" y="1105">保存问题、SQL、答案摘要、行数和 trace id</text>

  <rect class="eval" x="1008" y="1046" width="320" height="88"/>
  <text class="node-title" x="1040" y="1080">Offline Eval</text>
  <text class="node-body" x="1040" y="1105">/api/agent/evals 验证关键行为边界</text>

  <path class="arrow" d="M720 222 V270"/>
  <path class="arrow" d="M720 352 V400"/>
  <path class="arrow" d="M720 482 V536"/>

  <path class="branch" d="M520 626 H432"/>
  <text class="label" x="456" y="608">不明确</text>
  <path class="branch" d="M920 626 H1008"/>
  <text class="label" x="940" y="608">可查询</text>

  <path class="arrow" d="M1168 684 V744"/>
  <path class="arrow" d="M1168 850 V910"/>
  <path class="arrow" d="M1008 954 H880"/>
  <path class="arrow" d="M560 954 H432"/>
  <path class="arrow" d="M272 998 V1046"/>
  <path class="arrow" d="M432 1090 H560"/>
  <path class="arrow-soft" d="M880 1090 H1008"/>

  <path class="branch" d="M720 910 C720 838 878 834 998 914"/>
  <text class="label" x="752" y="872">失败且未达上限：sql.repair 后重试</text>
</svg>
